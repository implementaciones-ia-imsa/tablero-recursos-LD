<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Semanal — I.M.S.A.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --accent: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--card);
            border-bottom: 3px solid var(--accent);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-badge {
            background: var(--accent);
            color: white;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .header-title { font-size: 1.2rem; font-weight: 700; }
        .header-sub   { font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }

        .page {
            padding: 28px 32px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        .card-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 0.68rem;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-bottom: 18px;
        }

        /* TABLE */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        thead tr {
            background: rgba(255,255,255,0.04);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(51,65,85,0.5);
            color: var(--text-primary);
        }

        tbody tr:hover { background: rgba(255,255,255,0.03); }

        .aprov-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* STATES */
        .state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 0.83rem;
        }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 700px) {
            .page { padding: 14px; }
            .header { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<header class="header">
    <span class="header-badge">I.M.S.A.</span>
    <div>
        <div class="header-title" id="header-title">Detalle Semanal</div>
        <div class="header-sub" id="header-sub">Cargando...</div>
    </div>
</header>

<div class="page">
    <!-- BAR CHART -->
    <div class="card">
        <div class="card-title">Aprovechamiento diario</div>
        <div class="card-sub">Porcentaje de aprovechamiento por día de la semana</div>
        <div id="chart-wrapper">
            <div class="state-box"><div class="spinner"></div><span>Cargando...</span></div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card">
        <div class="card-title">Detalle por día</div>
        <div class="card-sub">Tiempos de uso y disponibilidad</div>
        <div id="table-wrapper">
            <div class="state-box"><div class="spinner"></div><span>Cargando...</span></div>
        </div>
    </div>
</div>

<script>
const MESES   = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

const params  = new URLSearchParams(window.location.search);
const recurso = params.get('recurso');
const semana  = parseInt(params.get('semana') || '1');
const mes     = parseInt(params.get('mes') || (new Date().getMonth()+1));
const anio    = parseInt(params.get('anio') || new Date().getFullYear());

if (!recurso) {
    document.getElementById('header-title').textContent = 'Error';
    document.getElementById('header-sub').textContent   = 'Parámetros inválidos';
} else {
    loadData();
}

function getAprovColor(pct) {
    pct = Math.max(0, Math.min(100, pct || 0));
    function mix(h1, h2, t) {
        const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
        const [r1,g1,b1] = p(h1), [r2,g2,b2] = p(h2);
        return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
    }
    if (pct <= 33)      return mix('#ef4444','#fca5a5', pct/33);
    else if (pct <= 66) return mix('#fde047','#d97706', (pct-33)/33);
    else                return mix('#bbf7d0','#15803d', (pct-66)/34);
}

async function loadData() {
    try {
        const res  = await fetch(`${window.location.origin}/api/recurso/${recurso}/semanal`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);

        const semanaData = json.data.semanas.find(s => s.semana === semana);
        const mesNombre  = MESES[mes - 1];

        document.getElementById('header-title').textContent = `Semana ${semana} — Recurso ${recurso}`;
        document.getElementById('header-sub').textContent   =
            `${semanaData ? semanaData.dIni : '?'} al ${semanaData ? semanaData.dFin : '?'} de ${mesNombre} ${anio}`;

        if (!semanaData || semanaData.dias.length === 0) {
            document.getElementById('chart-wrapper').innerHTML  = '<div class="state-box">Sin datos para esta semana.</div>';
            document.getElementById('table-wrapper').innerHTML  = '<div class="state-box">Sin datos para esta semana.</div>';
            return;
        }

        renderChart(semanaData.dias);
        renderTable(semanaData.dias);

    } catch (err) {
        document.getElementById('chart-wrapper').innerHTML = `<div class="state-box">⚠ ${err.message}</div>`;
        document.getElementById('table-wrapper').innerHTML = '';
    }
}

function formatFecha(isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    return `${DIAS_ES[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function renderChart(dias) {
    document.getElementById('chart-wrapper').innerHTML = '<canvas id="daily-chart" style="max-height:300px"></canvas>';

    new Chart(document.getElementById('daily-chart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: dias.map(d => formatFecha(d.fecha)),
            datasets: [{
                label: 'Aprovechamiento (%)',
                data:  dias.map(d => d.aprovechamiento),
                backgroundColor: dias.map(d => getAprovColor(d.aprovechamiento)),
                borderRadius: 6,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            animation: { duration: 600 },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    borderColor: '#334155',
                    borderWidth: 1,
                    titleColor: '#94a3b8',
                    bodyColor: '#f1f5f9',
                    callbacks: { label: item => ` Aprovechamiento: ${item.parsed.y.toFixed(2)}%` }
                }
            },
            scales: {
                x: {
                    grid:   { color: 'rgba(51,65,85,0.3)' },
                    ticks:  { color: '#64748b', font: { size:11, family:'Montserrat' } },
                    border: { color: '#334155' }
                },
                y: {
                    min: 0,
                    max: 100,
                    grid:   { color: 'rgba(51,65,85,0.3)' },
                    ticks:  { color: '#64748b', font: { size:11, family:'Montserrat' }, callback: v => `${v}%` },
                    border: { color: '#334155' },
                    title:  { display: true, text: 'Aprovechamiento (%)', color: '#475569', font: { size:11, family:'Montserrat' } }
                }
            }
        }
    });
}

function renderTable(dias) {
    const rows = dias.map(d => {
        const color = getAprovColor(d.aprovechamiento);
        const bgColor = color.replace('rgb(','rgba(').replace(')',', 0.15)');
        return `
            <tr>
                <td>${formatFecha(d.fecha)}</td>
                <td>${d.tiempoDeUso} ${d.unidad}</td>
                <td>${d.tiempoDisponible} ${d.unidad}</td>
                <td>
                    <span class="aprov-pill" style="color:${color}; background:${bgColor}">
                        ${d.aprovechamiento.toFixed(2)}%
                    </span>
                </td>
            </tr>
        `;
    }).join('');

    document.getElementById('table-wrapper').innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tiempo de Uso</th>
                        <th>Disponible</th>
                        <th>Aprovechamiento</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
}
</script>
</body>
</html>
