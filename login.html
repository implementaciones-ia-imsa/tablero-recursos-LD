<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitor de Recursos I.M.S.A.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --imsa-red-primary: #DC2626;
            --imsa-red-secondary: #B91C1C;
            --imsa-red-dark: #991B1B;
            --imsa-red-light: #FEE2E2;
            --imsa-gray-dark: #1F2937;
            --imsa-gray-medium: #6B7280;
            --imsa-gray-light: #F9FAFB;
            --imsa-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--imsa-red-primary) 0%, var(--imsa-red-dark) 50%, var(--imsa-gray-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--imsa-gray-dark);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            top: 20%;
            right: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow:
                0 25px 50px rgba(220, 38, 38, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--imsa-red-primary) 0%, var(--imsa-red-secondary) 50%, var(--imsa-red-dark) 100%);
            border-radius: 25px 25px 0 0;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.2));
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.2)); }
            50% { filter: drop-shadow(0 6px 12px rgba(220, 38, 38, 0.4)); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--imsa-red-primary) 0%, var(--imsa-red-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 16px;
            color: var(--imsa-gray-medium);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            border: 1px solid var(--imsa-red-secondary);
            color: var(--imsa-red-dark);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
            border: 1px solid #10B981;
            color: #047857;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: slideInDown 0.5s ease-out;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #google-signin-btn {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: var(--imsa-red-primary);
        }

        .loading p {
            margin-top: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .spinner {
            border: 3px solid rgba(220, 38, 38, 0.2);
            border-top: 3px solid var(--imsa-red-primary);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            margin-top: 35px;
            font-size: 13px;
            color: var(--imsa-gray-medium);
            font-weight: 500;
        }

        .info-text {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #1E40AF;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 40px 25px;
                margin: 15px;
                border-radius: 20px;
                max-width: 95%;
            }

            .logo {
                width: 110px;
                margin-bottom: 20px;
            }

            .login-title {
                font-size: 28px;
                margin-bottom: 10px;
            }

            .login-subtitle {
                font-size: 15px;
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="IMSA_Logo1-01 (1) (2).png" alt="IMSA Logo" class="logo">
        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Monitor de Recursos I.M.S.A.</p>

        <div id="info-message" class="info-text">
            🔐 Acceso solo para usuarios con correo @imsa.com.ar
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <div id="google-signin-btn"></div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Verificando credenciales...</p>
        </div>

        <p class="footer-text">© 2025 I.M.S.A. - Todos los derechos reservados</p>
    </div>

    <script>
        const CLIENT_ID = 'TU_GOOGLE_CLIENT_ID_AQUI'; // Reemplazar con tu Client ID
        const ALLOWED_DOMAIN = '@imsa.com.ar';

        // Inicializar Google Sign-In
        window.onload = function() {
            // Verificar si ya está autenticado
            const token = localStorage.getItem('imsa_auth_token');
            const user = localStorage.getItem('imsa_auth_user');
            const loginTime = localStorage.getItem('imsa_auth_time');

            if (token && user && loginTime) {
                const now = Date.now();
                const sessionAge = now - parseInt(loginTime);
                const maxAge = 24 * 60 * 60 * 1000; // 24 horas

                if (sessionAge < maxAge) {
                    window.location.href = 'index.html';
                    return;
                } else {
                    localStorage.removeItem('imsa_auth_token');
                    localStorage.removeItem('imsa_auth_user');
                    localStorage.removeItem('imsa_auth_time');
                }
            }

            // Renderizar botón de Google
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                error_callback: handleError
            });

            google.accounts.id.renderButton(
                document.getElementById('google-signin-btn'),
                {
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with',
                    width: '100%',
                    locale: 'es'
                }
            );
        };

        function handleCredentialResponse(response) {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');

            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Decodificar JWT
            const token = response.credential;
            const payload = JSON.parse(atob(token.split('.')[1]));

            console.log('🔐 Payload:', payload);

            // Validar dominio
            if (!payload.email.endsWith(ALLOWED_DOMAIN)) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = `❌ Solo se permiten usuarios con dominio ${ALLOWED_DOMAIN}. Tu email es: ${payload.email}`;
                errorDiv.style.display = 'block';

                // Cerrar sesión de Google
                google.accounts.id.disableAutoSelect();
                return;
            }

            // Login exitoso
            const authToken = generateToken();
            const loginTime = Date.now();

            localStorage.setItem('imsa_auth_token', authToken);
            localStorage.setItem('imsa_auth_user', payload.email);
            localStorage.setItem('imsa_auth_time', loginTime.toString());
            localStorage.setItem('imsa_auth_name', payload.name);
            localStorage.setItem('imsa_auth_picture', payload.picture);

            successDiv.textContent = `✅ Bienvenido ${payload.name}. Redirigiendo...`;
            successDiv.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        function handleError(error) {
            console.error('Error en Google Sign-In:', error);
            const errorDiv = document.getElementById('error-message');
            const loadingDiv = document.getElementById('loading');

            loadingDiv.style.display = 'none';
            errorDiv.textContent = 'Error al procesar Google Sign-In. Intenta nuevamente.';
            errorDiv.style.display = 'block';
        }

        function generateToken() {
            return Math.random().toString(36).substring(2) + Date.now().toString(36);
        }
    </script>
</body>
</html>
