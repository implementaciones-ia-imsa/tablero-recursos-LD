<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitor de Recursos I.M.S.A.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --imsa-red-primary: #DC2626;
            --imsa-red-secondary: #B91C1C;
            --imsa-red-dark: #991B1B;
            --imsa-red-light: #FEE2E2;
            --imsa-gray-dark: #1F2937;
            --imsa-gray-medium: #6B7280;
            --imsa-gray-light: #F9FAFB;
            --imsa-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--imsa-red-primary) 0%, var(--imsa-red-dark) 50%, var(--imsa-gray-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--imsa-gray-dark);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            top: 20%;
            right: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow:
                0 25px 50px rgba(220, 38, 38, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--imsa-red-primary) 0%, var(--imsa-red-secondary) 50%, var(--imsa-red-dark) 100%);
            border-radius: 25px 25px 0 0;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.2));
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.2)); }
            50% { filter: drop-shadow(0 6px 12px rgba(220, 38, 38, 0.4)); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--imsa-red-primary) 0%, var(--imsa-red-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 16px;
            color: var(--imsa-gray-medium);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            border: 1px solid var(--imsa-red-secondary);
            color: var(--imsa-red-dark);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
            border: 1px solid #10B981;
            color: #047857;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: slideInDown 0.5s ease-out;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #google-signin-btn {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        /* ===== Form local (solo visible cuando el host es de red interna) ===== */
        #local-login {
            display: none;
            margin-top: 10px;
            text-align: left;
        }

        #local-login .field {
            margin-bottom: 14px;
        }

        #local-login label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--imsa-gray-dark);
            margin-bottom: 6px;
        }

        #local-login input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #E5E7EB;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--imsa-gray-dark);
            background: var(--imsa-white);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #local-login input:focus {
            outline: none;
            border-color: var(--imsa-red-primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
        }

        #local-login button[type="submit"] {
            width: 100%;
            padding: 12px 14px;
            background: linear-gradient(135deg, var(--imsa-red-primary) 0%, var(--imsa-red-dark) 100%);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        #local-login button[type="submit"]:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
        }

        #local-login button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider-or {
            display: none;
            align-items: center;
            gap: 12px;
            color: var(--imsa-gray-medium);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 0 12px;
        }

        .divider-or::before,
        .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: var(--imsa-red-primary);
        }

        .loading p {
            margin-top: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .spinner {
            border: 3px solid rgba(220, 38, 38, 0.2);
            border-top: 3px solid var(--imsa-red-primary);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            margin-top: 35px;
            font-size: 13px;
            color: var(--imsa-gray-medium);
            font-weight: 500;
        }

        .info-text {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #1E40AF;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 40px 25px;
                margin: 15px;
                border-radius: 20px;
                max-width: 95%;
            }

            .logo {
                width: 110px;
                margin-bottom: 20px;
            }

            .login-title {
                font-size: 28px;
                margin-bottom: 10px;
            }

            .login-subtitle {
                font-size: 15px;
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="IMSA_Logo1-01 (1) (2).png" alt="IMSA Logo" class="logo">
        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Monitor de Recursos I.M.S.A.</p>

        <div id="info-message" class="info-text">
            🔐 Acceso solo para usuarios con correo @imsa.com.ar
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="local-login" autocomplete="off">
            <div class="field">
                <label for="local-username">Usuario</label>
                <input type="text" id="local-username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="local-password">Contraseña</label>
                <input type="password" id="local-password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="local-submit">Ingresar</button>
        </form>

        <div class="divider-or" id="divider-or">o</div>

        <div id="google-signin-btn"></div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Verificando credenciales...</p>
        </div>

        <p class="footer-text">© 2025 I.M.S.A. - Todos los derechos reservados</p>
    </div>

    <script>
        const CLIENT_ID = '58004563331-2nchpoun2e6ddlkmp7idqetkaqiiiko1.apps.googleusercontent.com';
        const ALLOWED_DOMAIN = '@imsa.com.ar';

        function isLocalHost(hostname) {
            const h = (hostname || '').toLowerCase();
            if (!h) return false;
            if (h === 'localhost' || h === '127.0.0.1' || h === '::1') return true;
            if (h.startsWith('svr-ia-2')) return true;
            if (/^192\.168\.\d+\.\d+$/.test(h)) return true;
            if (/^10\.\d+\.\d+\.\d+$/.test(h)) return true;
            if (/^172\.(1[6-9]|2\d|3[01])\.\d+\.\d+$/.test(h)) return true;
            return false;
        }

        // Inicializar Google Sign-In
        window.onload = function() {
            // Verificar si ya está autenticado
            const token = localStorage.getItem('imsa_auth_token');
            const user = localStorage.getItem('imsa_auth_user');
            const loginTime = localStorage.getItem('imsa_auth_time');

            if (token && user && loginTime) {
                const now = Date.now();
                const sessionAge = now - parseInt(loginTime);
                const maxAge = 24 * 60 * 60 * 1000; // 24 horas

                if (sessionAge < maxAge) {
                    window.location.href = 'index.html';
                    return;
                } else {
                    localStorage.removeItem('imsa_auth_token');
                    localStorage.removeItem('imsa_auth_user');
                    localStorage.removeItem('imsa_auth_time');
                }
            }

            // En hosts de red interna mostramos el form de usuario/clave junto al botón de Google.
            // En producción (Vercel) solo se muestra Google.
            const localAvailable = isLocalHost(window.location.hostname);
            if (localAvailable) {
                document.getElementById('local-login').style.display = 'block';
                document.getElementById('divider-or').style.display = 'flex';
                document.getElementById('local-login').addEventListener('submit', handleLocalSubmit);
            }

            // Renderizar botón de Google. width debe ser número en pixels (no "100%").
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                error_callback: handleError
            });

            google.accounts.id.renderButton(
                document.getElementById('google-signin-btn'),
                {
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with',
                    width: 360,
                    locale: 'es'
                }
            );
        };

        async function handleLocalSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('local-submit');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const loadingDiv = document.getElementById('loading');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';

            try {
                const username = document.getElementById('local-username').value.trim();
                const password = document.getElementById('local-password').value;

                const response = await fetch('/api/auth/local', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || `Error ${response.status}`);
                }

                localStorage.setItem('imsa_auth_token', data.token);
                localStorage.setItem('imsa_auth_user', data.user.email);
                localStorage.setItem('imsa_auth_time', Date.now().toString());
                localStorage.setItem('imsa_auth_name', data.user.name);
                localStorage.removeItem('imsa_auth_picture');

                successDiv.textContent = `✅ Bienvenido ${data.user.name}. Redirigiendo...`;
                successDiv.style.display = 'block';
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } catch (err) {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
                errorDiv.textContent = `❌ ${err.message}`;
                errorDiv.style.display = 'block';
            }
        }

        function handleCredentialResponse(response) {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');

            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Decodificar JWT
            const token = response.credential;
            const payload = JSON.parse(atob(token.split('.')[1]));

            console.log('🔐 Payload:', payload);

            // Validar dominio
            if (!payload.email.endsWith(ALLOWED_DOMAIN)) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = `❌ Solo se permiten usuarios con dominio ${ALLOWED_DOMAIN}. Tu email es: ${payload.email}`;
                errorDiv.style.display = 'block';

                // Cerrar sesión de Google
                google.accounts.id.disableAutoSelect();
                return;
            }

            // Login exitoso
            const authToken = generateToken();
            const loginTime = Date.now();

            localStorage.setItem('imsa_auth_token', authToken);
            localStorage.setItem('imsa_auth_user', payload.email);
            localStorage.setItem('imsa_auth_time', loginTime.toString());
            localStorage.setItem('imsa_auth_name', payload.name);
            localStorage.setItem('imsa_auth_picture', payload.picture);

            successDiv.textContent = `✅ Bienvenido ${payload.name}. Redirigiendo...`;
            successDiv.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        function handleError(error) {
            console.error('Error en Google Sign-In:', error);
            const errorDiv = document.getElementById('error-message');
            const loadingDiv = document.getElementById('loading');

            loadingDiv.style.display = 'none';
            errorDiv.textContent = 'Error al procesar Google Sign-In. Intenta nuevamente.';
            errorDiv.style.display = 'block';
        }

        function generateToken() {
            return Math.random().toString(36).substring(2) + Date.now().toString(36);
        }
    </script>
</body>
</html>
